<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with {{OTHER_NAME}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav>
    <a class="brand" href="/">Student<span>Profiles</span></a>

</nav>
